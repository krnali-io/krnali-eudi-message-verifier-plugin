name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Format, vet and race tests
        run: |
          make lint
          make test
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build both executables
        run: |
          make build
          CGO_ENABLED=0 go build -trimpath -o /tmp/verifylink-demo ./cmd/verifylink-demo
      - name: Build runtime images
        run: |
          docker build -f deploy/Dockerfile -t message-verifier:check .
          docker build -f deploy/Dockerfile.demo -t message-verifier-demo:check .
